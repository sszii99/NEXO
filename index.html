<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXO</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <header>
    <div class="logo">NEXO</div>

    <nav>
      <a href="#">الرئيسية</a>
      <a href="#">استكشاف</a>
      <a href="#">الإشعارات</a>
      <a href="#">الرسائل</a>
      <a href="#">الملف الشخصي</a>
    </nav>
  </header>

  <main>

    <section class="welcome">
      <h1>مرحبًا بك في NEXO 👋</h1>
      <p>تواصل، شارك، واكتشف أشخاصًا جدد.</p>
    </section>

    <section class="create-post">
      <textarea id="postText" placeholder="ماذا تريد أن تشارك؟"></textarea>

      <button id="postButton">
        نشر
      </button>
    </section>

    <section id="posts">

      <article class="post">
        <div class="post-user">
          <strong>NEXO</strong>
        </div>

        <p>
          مرحبًا بك في أول منشور على NEXO 🚀
        </p>

        <div class="post-actions">
          <button>❤️ إعجاب</button>
          <button>💬 تعليق</button>
          <button>↗️ مشاركة</button>
        </div>
      </article>

    </section>

  </main>

  <footer>
    <p>© 2026 NEXO</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
